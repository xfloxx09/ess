services:
  postgres:
    image: postgres:16
    container_name: ess-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ess
      POSTGRES_PASSWORD: ess
      POSTGRES_DB: ess
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
